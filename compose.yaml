services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deokhugam}
      POSTGRES_USER: ${POSTGRES_USER:-deokhugam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # 운영 RDS(db.t4g.micro)는 1GB. 4GB로 묶은 Docker 안에 다 넣으려고 조금 줄였다
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 아래는 모니터링 실험용. `docker compose --profile monitoring up -d`로만 뜬다
  # 설정(사용자·인덱스·데이터 뷰·데이터 소스·대시보드)은 monitoring/setup.sh가 API로 넣는다
  elasticsearch:
    profiles: [monitoring]
    image: elasticsearch:9.5.3
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      # 로컬 실험이라 HTTP TLS는 끈다. 인증은 켜 두어 EC2로 옮길 때 API 호출이 그대로 쓰이게 한다
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-elastic-local}
      # 힙 1GB면 실제 사용량이 1.5GB를 넘는다. 8GB 노트북(Docker 4GB)에 맞춰 줄였다
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 1g
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    profiles: [monitoring]
    image: kibana:9.5.3
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      # kibana_system 비밀번호는 setup.sh가 ES API로 정한다. 그 전까지 Kibana는 연결을 재시도한다
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:-kibana-local}
      # 512면 9.5가 시작 중에 힙 부족(exit 134)으로 죽는다. 768에서 뜨는 걸 확인했다
      NODE_OPTIONS: --max-old-space-size=768
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    profiles: [monitoring]
    image: docker.elastic.co/beats/filebeat:9.5.3
    # --environment container는 이미지 기본값(로그를 stdout으로). command를 바꾸면 사라져서 다시 적는다
    # Windows 바인드 마운트는 파일 권한이 넓게 보여서 권한 검사를 끈다
    command: ["--environment", "container", "--strict.perms=false"]
    environment:
      FILEBEAT_ES_PASSWORD: ${FILEBEAT_ES_PASSWORD:-filebeat-local}
    volumes:
      - ./monitoring/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./.logs:/logs:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.15.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:13.2.5
    ports:
      # 3000은 PC에 설치된 Grafana 서비스와 겹치기 쉬워 3001을 기본으로 쓴다
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana-local}
    volumes:
      - grafana-data:/var/lib/grafana

  # 부하 테스트용 앱. 운영 태스크(Fargate 0.5 vCPU / 1GB)와 같은 울타리에 가둔다
  # `docker compose --profile monitoring --profile loadtest up -d --build` (절차는 loadtest/README.md)
  app:
    profiles: [loadtest]
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      # prometheus 엔드포인트와 .logs 파일 로그(Filebeat가 읽는다)가 dev 프로필에만 있다
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-deokhugam}
      # Grafana의 p95 패널과 Tomcat 스레드 패널에 필요하다
      MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS: "true"
      SERVER_TOMCAT_MBEANREGISTRY_ENABLED: "true"
    volumes:
      - ./.logs:/app/.logs
    mem_limit: 1g
    cpus: "0.5"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  es-data:
  filebeat-data:
  prometheus-data:
  grafana-data:
