spring:
  application:
    name: deokhugam
  profiles:
    default: dev

    #JPA
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true
  batch:
    job:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  metrics:
    tags:
      application: ${spring.application.name}
  # Grafana Cloud 전송은 prod에서만 켠다 (application-prod.yaml)
  otlp:
    metrics:
      export:
        enabled: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG