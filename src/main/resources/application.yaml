spring:
  application:
    name: deokhugam
  profiles:
    default: dev

    #JPA
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true
        globally_quoted_identifiers_skip_column_definitions: true
  batch:
    job:
      enabled: false
  # 스케줄러 스레드 (SchedulingConfig)
  task:
    scheduling:
      pool:
        size: 1 # 작업을 하나씩 차례로 실행
      thread-name-prefix: scheduler-

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG