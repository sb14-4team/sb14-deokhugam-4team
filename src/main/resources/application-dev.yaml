spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:deokhugam}
    username: ${POSTGRES_USER:deokhugam}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false


management:
  endpoints:
    web:
      exposure:
        include: health,info,Prometheus