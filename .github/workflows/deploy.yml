name: Deploy to ECS

on:
  push:
    branches:
      - main
      - 'chore/CD_김승호' # 임시: 팀 합의 전 배포 시험용, PR 전에 지운다
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: deokhugam
  ECS_CLUSTER: deokhugam-cluster
  ECS_SERVICE: deokhugam-service
  CONTAINER_NAME: deokhugam-app
  TASK_DEFINITION: .aws/task-definition.json
  LOG_GROUP: /ecs/deokhugam

jobs:
  verify:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: deokhugam_test
          POSTGRES_USER: deokhugam
          POSTGRES_PASSWORD: deokhugam-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deokhugam -d deokhugam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build, test and check formatting
        env:
          POSTGRES_PASSWORD: deokhugam-ci
        run: bash ./gradlew --no-daemon build

      # 실행 요약에 테스트 수·실패 목록을 남긴다 (테스트가 실패해도 기록)
      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: build/test-results/test/*.xml
          detailed_summary: true

  deploy:
    name: Push Image and Deploy
    needs: verify
    runs-on: ubuntu-latest
    # 배포 이력은 Environments(production)에 남는다. 액세스 키도 이 환경의 Secret이라 main 배포에서만 꺼낼 수 있다
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # 새 가입 방식 계정은 OIDC 공급자 생성(iam:*Provider*)이 SCP로 막혀 있어 배포 전용 IAM 사용자 키를 쓴다
      - name: Configure AWS credentials
        id: aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Fill in account ID
        env:
          AWS_ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
        run: |
          test -n "$AWS_ACCOUNT_ID" || { echo "AWS 계정 ID를 확인하지 못했습니다"; exit 1; }
          sed -i "s/<AWS_ACCOUNT_ID>/${AWS_ACCOUNT_ID}/g" "$TASK_DEFINITION"
          if grep -n '<[A-Z_]*>' "$TASK_DEFINITION"; then
            echo "태스크 정의에 채워지지 않은 자리표시자가 남아 있습니다"; exit 1
          fi

      - name: Render task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to ECS service
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          desired-count: 1
          wait-for-service-stability: true

      # 회로 차단기가 이전 버전으로 롤백해도 서비스는 '안정'이 되어 위 단계가 성공한다. 새 리비전이 실제로 자리 잡았는지 따로 확인한다
      - name: Verify new revision is running
        env:
          EXPECTED: ${{ steps.deploy.outputs.task-definition-arn }}
        run: |
          read -r actual rollout running desired < <(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].deployments[?status==`PRIMARY`] | [0].[taskDefinition, rolloutState, runningCount, desiredCount]' \
            --output text)
          echo "primary=$actual rollout=$rollout running=$running/$desired"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "새 리비전이 아니라 $actual 이(가) 돌고 있습니다 (롤백됐을 수 있음)"; exit 1
          fi
          if [ "$rollout" != "COMPLETED" ] || [ "$running" -lt 1 ]; then
            echo "배포가 끝나지 않았습니다"; exit 1
          fi

      - name: Smoke test through ALB
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          test -n "$APP_URL" || { echo "production 환경 변수 APP_URL이 없습니다"; exit 1; }
          bash .github/scripts/smoke-test.sh "$APP_URL"

      # 실패 원인을 AWS 콘솔에 가지 않고 이 실행 로그에서 바로 보도록 서비스 이벤트, 멈춘 태스크 사유, 앱 로그를 남긴다
      - name: Show ECS events and app logs
        if: failure() && steps.aws.outcome == 'success'
        run: |
          echo "::group::ECS 서비스 이벤트 (최근 10개)"
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].events[:10].[createdAt, message]' --output text || true
          echo "::endgroup::"

          echo "::group::멈춘 태스크와 사유 (최근 3개)"
          tasks=$(aws ecs list-tasks --cluster "$ECS_CLUSTER" --service-name "$ECS_SERVICE" \
            --desired-status STOPPED --query 'taskArns[:3]' --output text || true)
          if [ -n "$tasks" ] && [ "$tasks" != "None" ]; then
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks $tasks \
              --query 'tasks[].{stoppedReason: stoppedReason, containers: containers[].[name, exitCode, reason]}' || true
          fi
          echo "::endgroup::"

          echo "::group::앱 로그 (최근 20분)"
          aws logs tail "$LOG_GROUP" --since 20m --format short || true
          echo "::endgroup::"

      - name: Write deploy summary
        if: always() && steps.aws.outcome == 'success'
        env:
          APP_URL: ${{ vars.APP_URL }}
          TASK_DEFINITION_ARN: ${{ steps.deploy.outputs.task-definition-arn }}
          JOB_STATUS: ${{ job.status }}
        run: |
          console="https://${AWS_REGION}.console.aws.amazon.com"
          {
            echo "## 배포 결과: ${JOB_STATUS}"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 커밋 | \`${GITHUB_SHA::7}\` |"
            echo "| 태스크 정의 | \`${TASK_DEFINITION_ARN##*/}\` |"
            echo "| 앱 주소 | ${APP_URL}/actuator/health |"
            echo "| 앱 로그 | [CloudWatch Logs](${console}/cloudwatch/home?region=${AWS_REGION}#logsV2:log-groups/log-group/\$252Fecs\$252Fdeokhugam) |"
            echo "| 서비스 상태 | [ECS 서비스](${console}/ecs/v2/clusters/${ECS_CLUSTER}/services/${ECS_SERVICE}/health?region=${AWS_REGION}) |"
          } >> "$GITHUB_STEP_SUMMARY"
